name: CI

on:
  workflow_dispatch:
  merge_group:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  requires-approval:
    runs-on: ubuntu-latest
    name: 'Waiting for PR approval as this workflow runs on pull_request_target'
    if: github.event_name == 'pull_request_target' && github.event.pull_request.head.repo.owner.login != 'cap-js'
    environment: pr-approval
    steps:
      - name: Approval Step
        run: echo "This job has been approved!"

  test:
    name: Tests with Node.js ${{ matrix.node-version }} (CDS ${{ matrix.cds-version }})
    needs: requires-approval
    if: always() && (needs.requires-approval.result == 'success' || needs.requires-approval.result == 'skipped')
    runs-on: ubuntu-latest
    timeout-minutes: 3
    strategy:
      fail-fast: false
      matrix:
        node-version: [22, 24]
        cds-version: [9, latest]
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: ${{ matrix.node-version }}
      - name: Pin CDS 9 compatible stack
        if: matrix.cds-version == '9'
        run: |
          npm pkg set "overrides.@cap-js/sqlite=^2"
          npm pkg set "overrides.@cap-js/hana=^2"
          npm pkg set "overrides.@sap/cds-mtxs=^3"
          npm pkg set "devDependencies.@sap/cds=^9"
          npm pkg set --workspace=tests/bookshop "dependencies.@sap/cds=^9"
          npm pkg set --workspace=tests/bookshop-mtx "dependencies.@sap/cds=^9"
      - run: npm i -g @sap/cds-dk@${{ matrix.cds-version }}
      - run: npm i
      - run: cd tests/bookshop && cds v -i
      - run: npm run test

  integration-tests:
    name: Integration Tests with Node.js ${{ matrix.node-version }} (CDS ${{ matrix.cds-version }})
    needs: requires-approval
    if: always() && (needs.requires-approval.result == 'success' || needs.requires-approval.result == 'skipped')
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: [22, 24]
        cds-version: [9, latest]
        # On PRs only latest/Node 24 runs; the merge queue runs the full matrix.
        exclude: ${{ github.event_name == 'merge_group' && fromJSON('[]') || fromJSON('[{"node-version":22,"cds-version":9},{"node-version":24,"cds-version":9},{"node-version":22,"cds-version":"latest"}]') }}
    env:
      HANA_SERVICE: cap-js-mcp-hana-${{ github.run_id }}-${{ github.run_number }}-${{ github.run_attempt }}-${{ matrix.cds-version }}-${{ matrix.node-version }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Setup CF CLI and authenticate
        uses: cap-js/cf-setup@v2
        with:
          api: ${{ secrets.CF_API }}
          org: ${{ secrets.CF_ORG }}
          space: ${{ secrets.CF_SPACE }}
          username: ${{ secrets.CF_USERNAME }}
          password: ${{ secrets.CF_PASSWORD }}

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: ${{ matrix.node-version }}

      - run: npm i -g @sap/cds-dk@${{ matrix.cds-version }}

      - name: Pin CDS 9 compatible stack
        if: matrix.cds-version == '9'
        run: |
          npm pkg set "overrides.@cap-js/sqlite=^2"
          npm pkg set "overrides.@cap-js/hana=^2"
          npm pkg set "overrides.@sap/cds-mtxs=^3"
          npm pkg set "devDependencies.@sap/cds=^9"
          npm pkg set --workspace=tests/bookshop "dependencies.@sap/cds=^9"
          npm pkg set --workspace=tests/bookshop-mtx "dependencies.@sap/cds=^9"

      - run: npm i
      - run: cds v -i

      # Deploy model to HANA, bind against it, and run tests in hybrid mode
      - run: cf create-service hana hdi-shared $HANA_SERVICE
      - run: cd tests/bookshop && CDS_ENV=production cds deploy --to hana:$HANA_SERVICE
      - run: cds bind db -2 $HANA_SERVICE -o package.json
      - run: cds bind --exec -- npm run test

      # Cleanup BTP services
      - name: Delete HDI Container Key
        if: ${{ always() }}
        continue-on-error: true # transient failure shouldn't prevent container deletion attempt
        run: cf delete-service-key $HANA_SERVICE $HANA_SERVICE-key -f

      - name: Delete HDI Container
        if: ${{ always() }}
        run: | # Note: the initial delete often fails with "ongoing operation on service binding"
          for i in {1..3}; do
            cf delete-service $HANA_SERVICE -f && break
            echo "HDI container delete failed, retrying ($i/3)..."
            sleep 10
          done

  results:
    if: always()
    runs-on: ubuntu-latest
    name: Summary
    needs: [test, integration-tests]
    steps:
      - if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: exit 1
